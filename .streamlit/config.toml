[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# Dashboard publik: menu pengembang disembunyikan, detail error tidak ditampilkan ke pengunjung
toolbarMode = "minimal"
showErrorDetails = false

[server]
enableStaticServing = false
